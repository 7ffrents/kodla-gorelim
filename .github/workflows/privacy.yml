name: privacy

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video kimligi"
        required: true
      privacy:
        description: "public, unlisted veya private"
        required: true
        default: "public"

concurrency:
  group: youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install google-api-python-client google-auth

      - name: Gorunurlugu degistir
        working-directory: tools
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          PRIVACY: ${{ inputs.privacy }}
        run: python set_privacy.py

      - name: Durumu repoya yaz
        if: always()
        run: |
          git config user.name "kodla-gorelim-bot"
          git config user.email "kodla-gorelim-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: gorunurluk degisti"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
